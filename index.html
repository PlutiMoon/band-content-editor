<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代号：BAND — 在线内容编辑器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
  <h1>代号：BAND</h1>
  <div class="subtitle">在线内容编辑器</div>
  <div class="form">
    <label>项目访问密钥</label>
    <input type="password" id="login-key" placeholder="输入密钥进入编辑器">
    <div style="display:flex;gap:8px;">
      <input type="text" id="login-name" placeholder="你的名字（选填）" style="flex:2;margin-bottom:0;">
      <button class="btn-ok" onclick="doLogin()" style="flex:1;margin-bottom:0;">进入</button>
    </div>
    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin-top:8px;">
      <input type="checkbox" id="login-remember" checked style="width:auto;margin:0;"> 记住我（关闭标签页后无需重新输入）
    </label>
    <div class="error" id="login-error">密钥错误</div>
  </div>
  <div class="hint">输入团队共享密钥即可进入。无需注册账号。<br>密钥请联系项目负责人获取。</div>
</div>

<!-- Main Editor (hidden until login) -->
<div id="app" style="display:none;height:100vh;">
  <div id="sidebar">
    <h2>代号：BAND</h2>
    <div style="position:relative;">
      <button class="tab-btn active" data-tab="actions">⚡ 行动</button>
      <button class="tab-btn" data-tab="events">📋 事件</button>
      <button class="tab-btn" data-tab="dialogues">💬 对话</button>
      <button class="tab-btn" data-tab="phone">📱 手机消息</button>
      <button class="tab-btn" data-tab="world">🌍 世界</button>
      <button class="tab-btn" data-tab="health">体检</button>
      <button class="tab-btn" data-tab="snapshots">快照</button>
      <button class="tab-btn" data-tab="references">引用</button>
      <button class="tab-btn" data-tab="graph">关系图</button>
      <button class="tab-btn" data-tab="search">搜索</button>
      <button class="tab-btn" data-tab="releases">发布</button>
      <button class="tab-btn" data-tab="audit">历史</button>
      <select id="mobile-tab-select">
        <option value="actions">⚡ 行动</option>
        <option value="events">📋 事件</option>
        <option value="dialogues">💬 对话</option>
        <option value="phone">📱 手机消息</option>
        <option value="world">🌍 世界</option>
        <option value="health">体检</option>
        <option value="snapshots">快照</option>
        <option value="references">引用</option>
        <option value="graph">关系图</option>
        <option value="search">搜索</option>
        <option value="releases">发布</option>
        <option value="audit">历史</option>
      </select>
      <div id="conn-status">
        <div id="conn-dot"></div><span id="conn-text">连接中</span>
      </div>
    </div>
    <div class="sidebar-actions">
      <span class="online-dots" id="online-dots" title=""></span>
      <button onclick="window._createManualSnapshot && window._createManualSnapshot()">创建快照</button>
      <button id="btn-pull" onclick="pullFromDB()">🔄 从数据库拉取</button>
      <button class="btn-ok" onclick="exportAll()">📦 全部导出</button>
    </div>
    <div class="online-names" id="online-names" style="display:none;"></div>
    <div class="online-users-desktop" id="online-users-desktop"></div>
  </div>
  <div id="main">
    <div id="presence-bar"></div>
    <div class="toolbar" id="toolbar"></div>
    <div class="content-area" id="content"></div>
  </div>
</div>

<script type="importmap">
{ "imports": { "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2" } }
</script>
<script type="module" src="app.js"></script>
</body>
</html>
